services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unit-management-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
